name: Record Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the website to record"
        required: true
        default: "https://yoursite.github.io"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run recording script
        run: |
          python record.py "${{ github.event.inputs.url }}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-recording
          path: output/recording.mp4
          retention-days: 7

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: output/screenshots/
          retention-days: 7